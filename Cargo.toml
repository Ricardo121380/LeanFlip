[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = "0.22"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2.0"
log = "0.4"
dirs = "5.0"
tempfile = "3"

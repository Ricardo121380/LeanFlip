[workspace]
resolver = "2"
members = ["crates/core", "crates/service", "crates/app", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"  # std::fs::File::lock

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = "0.22"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2.0"
log = "0.4"
dirs = "5.0"
json5 = "0.4.1"
serde_yaml = "0.9"
indexmap = "2"
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.4"
zeroize = "1.9.1"

[package]
name = "ccsl-cli"
description = "Command-line and terminal workspace for SwitchLeaf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "switchleaf"
path = "src/main.rs"

[[bin]]
name = "ccsl"
path = "src/compat.rs"
test = false

[dependencies]
ccsl-core = { path = "../core" }
ccsl-service = { path = "../service" }
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select", "password"] }
ctrlc = "3.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde_json.workspace = true
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true

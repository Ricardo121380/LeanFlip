name: Package managers

on:
  push:
    branches: [main]
    paths: ['packages/npm/**', 'Casks/**', 'scripts/prepare-distribution.mjs', '.github/workflows/distribution.yml', '.github/workflows/release.yml']
  pull_request:
    paths: ['packages/npm/**', 'Casks/**', 'scripts/prepare-distribution.mjs', '.github/workflows/distribution.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolate the native download cache
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/ccsl-npm-cache" >> "$GITHUB_ENV"
          node --input-type=module -e "import { cliName } from './packages/npm/lib/distribution.js'; console.log('PACKAGE_CLI=' + cliName); console.log('PACKAGE_APP=' + cliName + '-app')" >> "$GITHUB_ENV"
      - name: Test download and installation boundaries
        run: node --test packages/npm/test/*.test.mjs
      - name: Pack and install without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack ./packages/npm --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" "$RUNNER_TEMP"/npm-package/*.tgz --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-prefix/bin" >> "$GITHUB_PATH"
      - name: Verify the installed native CLI and terminal menu
        run: |
          "$PACKAGE_CLI" --version
          "$PACKAGE_CLI" --home "$RUNNER_TEMP/ccsl-smoke" status --json
          test ! -e "$RUNNER_TEMP/ccsl-smoke"
          "$PACKAGE_APP" --help
          if [ "$PACKAGE_CLI" = leanflip ]; then
            python3 scripts/check-cli-menu.py --binary "$RUNNER_TEMP/npm-prefix/bin/$PACKAGE_CLI"
          fi
      - name: Verify desktop download
        run: '"$PACKAGE_APP" download --output "$RUNNER_TEMP/desktop-package"'
      - name: Verify macOS desktop installation and replacement
        if: runner.os == 'macOS'
        run: |
          "$PACKAGE_APP" install --app-dir "$RUNNER_TEMP/Applications"
          "$PACKAGE_APP" install --replace --app-dir "$RUNNER_TEMP/Applications"
          APP_BUNDLE=$(node --input-type=module -e "import { appName } from './packages/npm/lib/distribution.js'; console.log(appName)")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/Info.plist" | grep -Fx dev.ccswitch.lite
          file "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/MacOS/ccswitch-lite"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select the Casks for the pinned native release
        run: |
          node --input-type=module -e "import { cliName } from './packages/npm/lib/distribution.js'; console.log('CLI_CASK=' + cliName); console.log('APP_CASK=' + (cliName === 'leanflip' ? 'leanflip-app' : 'ccswitch-lite'))" >> "$GITHUB_ENV"
      - name: Use the runner's preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Tap the checked-out revision and inspect definitions
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap ricardo121380/ccswitch-lite "$GITHUB_WORKSPACE"
          brew info --json=v2 --cask "ricardo121380/ccswitch-lite/$CLI_CASK"
          if [ "$RUNNER_OS" = macOS ]; then
            brew info --json=v2 --cask "ricardo121380/ccswitch-lite/$APP_CASK"
          fi
      - name: Install and test CLI
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask "ricardo121380/ccswitch-lite/$CLI_CASK"
          "$CLI_CASK" --version
          "$CLI_CASK" --home "$RUNNER_TEMP/brew-cli-smoke" status --json
          test ! -e "$RUNNER_TEMP/brew-cli-smoke"
      - name: Install desktop Cask in an isolated app directory
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/Applications" "ricardo121380/ccswitch-lite/$APP_CASK"
          APP_BUNDLE=$(node --input-type=module -e "import { appName } from './packages/npm/lib/distribution.js'; console.log(appName)")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/Info.plist" | grep -Fx dev.ccswitch.lite

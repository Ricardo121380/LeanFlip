name: Package managers

on:
  push:
    branches: [main]
    paths: ['packages/npm/**', 'Casks/**', 'scripts/prepare-distribution.mjs', '.github/workflows/distribution.yml', '.github/workflows/release.yml']
  pull_request:
    paths: ['packages/npm/**', 'Casks/**', 'scripts/prepare-distribution.mjs', '.github/workflows/distribution.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Installer tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test download and installation boundaries
        run: node --test packages/npm/test/*.test.mjs

  # release.json and the Casks exist only once a release has been generated; until then
  # there is nothing to download or install.
  pinned:
    name: Pinned release
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f packages/npm/release.json ]; then echo present=true; else echo present=false; fi >> "$GITHUB_OUTPUT"

  npm:
    name: npm package (${{ matrix.os }})
    needs: [tests, pinned]
    if: needs.pinned.outputs.present == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolate the native download cache
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/leanflip-npm-cache" >> "$GITHUB_ENV"
          node --input-type=module -e "import { cliName, appName, appBinary, bundleId } from './packages/npm/lib/distribution.js'; console.log('PACKAGE_CLI=' + cliName); console.log('PACKAGE_APP=' + cliName + '-app'); console.log('APP_BUNDLE=' + appName); console.log('APP_BINARY=' + appBinary); console.log('BUNDLE_ID=' + bundleId)" >> "$GITHUB_ENV"
      - name: Pack and install without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack ./packages/npm --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" "$RUNNER_TEMP"/npm-package/*.tgz --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-prefix/bin" >> "$GITHUB_PATH"
      - name: Select menu smoke test for the pinned release
        run: |
          version="$(node --input-type=module -e "import { manifest } from './packages/npm/lib/distribution.js'; if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('Invalid release version'); console.log(manifest.version)")"
          git fetch --no-tags --depth=1 origin "refs/tags/v$version"
          git show FETCH_HEAD:scripts/check-cli-menu.py > "$RUNNER_TEMP/check-cli-menu.py"
      - name: Verify the installed native CLI and terminal menu
        run: |
          "$PACKAGE_CLI" --version
          "$PACKAGE_CLI" --home "$RUNNER_TEMP/leanflip-smoke" status --json
          test ! -e "$RUNNER_TEMP/leanflip-smoke"
          "$PACKAGE_APP" --help
          if [ "$PACKAGE_CLI" = leanflip ]; then
            python3 "$RUNNER_TEMP/check-cli-menu.py" --binary "$RUNNER_TEMP/npm-prefix/bin/$PACKAGE_CLI"
          fi
      - name: Verify desktop download
        run: '"$PACKAGE_APP" download --output "$RUNNER_TEMP/desktop-package"'
      - name: Verify macOS desktop installation and replacement
        if: runner.os == 'macOS'
        run: |
          "$PACKAGE_APP" install --app-dir "$RUNNER_TEMP/Applications"
          "$PACKAGE_APP" install --replace --app-dir "$RUNNER_TEMP/Applications"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/Info.plist" | grep -Fx "$BUNDLE_ID"
          file "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/MacOS/$APP_BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  homebrew:
    name: Homebrew (${{ matrix.os }})
    needs: [pinned]
    if: needs.pinned.outputs.present == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select the Casks for the pinned native release
        run: |
          node --input-type=module -e "import { cliName, appCask, appName, bundleId } from './packages/npm/lib/distribution.js'; console.log('CLI_CASK=' + cliName); console.log('APP_CASK=' + appCask); console.log('APP_BUNDLE=' + appName); console.log('BUNDLE_ID=' + bundleId)" >> "$GITHUB_ENV"
      - name: Use the runner's preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Tap the checked-out revision and inspect definitions
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap ricardo121380/leanflip "$GITHUB_WORKSPACE"
          brew info --json=v2 --cask "ricardo121380/leanflip/$CLI_CASK"
          if [ "$RUNNER_OS" = macOS ]; then
            brew info --json=v2 --cask "ricardo121380/leanflip/$APP_CASK"
          fi
      - name: Install and test CLI
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask "ricardo121380/leanflip/$CLI_CASK"
          "$CLI_CASK" --version
          "$CLI_CASK" --home "$RUNNER_TEMP/brew-cli-smoke" status --json
          test ! -e "$RUNNER_TEMP/brew-cli-smoke"
      - name: Install desktop Cask in an isolated app directory
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/Applications" "ricardo121380/leanflip/$APP_CASK"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Applications/$APP_BUNDLE/Contents/Info.plist" | grep -Fx "$BUNDLE_ID"

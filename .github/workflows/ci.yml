name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Standalone CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CLI without desktop dependencies
        run: cargo test -p ccsl-cli --locked
      - name: Build standalone binary
        run: cargo build -p ccsl-cli --release --locked
      - name: Smoke test in an isolated home
        run: |
          target/release/ccsl --version
          target/release/ccsl --home "$RUNNER_TEMP/ccsl-smoke" status --json
          test ! -e "$RUNNER_TEMP/ccsl-smoke"
      - name: Check interactive menu in a pseudo-terminal
        run: python3 scripts/check-cli-menu.py --binary target/release/ccsl
      - name: Archive binary with executable permissions
        run: tar -C target/release -czf ccsl-${{ matrix.os }}-${{ runner.arch }}.tar.gz ccsl
      - uses: actions/upload-artifact@v4
        with:
          name: ccsl-${{ matrix.os }}-${{ runner.arch }}
          path: ccsl-${{ matrix.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error

  checks:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-14
            bundle: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check frontend types
        run: pnpm typecheck
      - name: Test frontend
        run: pnpm test
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify desktop packaging (no release)
        run: pnpm tauri build --debug --ci --bundles ${{ matrix.bundle }}

name: Publish to npm

# Publishing a reviewed GitHub release publishes the npm .tgz that the release
# workflow attached to it. npm trusts this workflow through trusted publishing
# (OIDC), so no npm token is stored; provenance is generated automatically.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.2.1
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish leanflip
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@11.12.1
      - name: Download and verify the release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH, got '$RELEASE_TAG'"; exit 1; }
          test "$PRERELEASE" != true || { echo "Pre-releases are not published to npm"; exit 1; }
          test "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          version="${RELEASE_TAG#v}"
          mkdir dist && cd dist
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern "leanflip-$version.tgz" --pattern SHA256SUMS
          grep -E "  leanflip-${version//./\\.}\.tgz$" SHA256SUMS | sha256sum --check
          test "$(tar -xzOf "leanflip-$version.tgz" package/package.json | jq -r '.name + "@" + .version')" = "leanflip@$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=$PWD/leanflip-$version.tgz" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          if npm view "leanflip@$VERSION" version >/dev/null 2>&1; then
            echo "leanflip@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "$PACKAGE" --access public
